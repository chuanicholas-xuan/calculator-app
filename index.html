<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <div id="app">
      <main class="calculator">
        <div class="toolbar">
          <button type="button" id="history-open" class="icon-button" aria-label="Show history">
            <!-- A clock with an arrow around it: the usual "history" icon. -->
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
              <path d="M12 7v5l3 2" />
            </svg>
          </button>
          <button type="button" id="settings-open" class="icon-button" aria-label="Settings">
            <!-- A gear: the usual "settings" icon. -->
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
            </svg>
          </button>
          <button type="button" id="converter-open" class="icon-button" aria-label="Converter">
            <!-- Two arrows going opposite ways: the usual "convert" icon. -->
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 4L3 8l4 4" />
              <path d="M3 8h14" />
              <path d="M17 20l4-4-4-4" />
              <path d="M21 16H7" />
            </svg>
          </button>
          <!-- Switches the extra scientific buttons on and off. aria-pressed tells screen readers if it is on. -->
          <button type="button" id="mode-toggle" class="mode-button" aria-pressed="false">sci</button>
        </div>

        <!-- The screen: the sum on top, the answer below. aria-live makes screen readers announce changes. -->
        <div id="display" class="display" aria-live="polite">
          <div id="expression" class="expression">0</div>
          <output id="result" class="result"></output>
        </div>

        <!-- Scientific buttons: only shown when the calculator has the "scientific" class.
             Buttons with a 2nd version keep both versions in data-first-* and data-second-* attributes. -->
        <div class="science-keys">
          <button type="button" data-action="second">2nd</button>
          <button type="button" data-action="angle" aria-label="angle unit">deg</button>
          <button type="button" data-action="open" data-value="sin" data-first-action="open" data-first-value="sin" data-first-label="sin" data-second-action="open" data-second-value="asin" data-second-label="sin⁻¹">sin</button>
          <button type="button" data-action="open" data-value="cos" data-first-action="open" data-first-value="cos" data-first-label="cos" data-second-action="open" data-second-value="acos" data-second-label="cos⁻¹">cos</button>
          <button type="button" data-action="open" data-value="tan" data-first-action="open" data-first-value="tan" data-first-label="tan" data-second-action="open" data-second-value="atan" data-second-label="tan⁻¹">tan</button>

          <button type="button" data-action="operator" data-value="^" aria-label="power">xʸ</button>
          <button type="button" data-action="open" data-value="lg" data-first-action="open" data-first-value="lg" data-first-label="lg" data-second-action="open" data-second-value="pow10" data-second-label="10ˣ">lg</button>
          <button type="button" data-action="open" data-value="ln" data-first-action="open" data-first-value="ln" data-first-label="ln" data-second-action="open" data-second-value="exp" data-second-label="eˣ">ln</button>
          <button type="button" data-action="open" data-value="(">(</button>
          <button type="button" data-action="close">)</button>

          <button type="button" data-action="open" data-value="sqrt" data-first-action="open" data-first-value="sqrt" data-first-label="√x" data-second-action="postfix" data-second-value="²" data-second-label="x²">√x</button>
          <button type="button" data-action="postfix" data-value="!" aria-label="factorial">x!</button>
          <button type="button" data-action="postfix" data-value="⁻¹" aria-label="one over x">1/x</button>
          <button type="button" data-action="constant" data-value="π">π</button>
          <button type="button" data-action="constant" data-value="e">e</button>
        </div>

        <!-- All buttons live in one container so JS can listen to them in one place later. -->
        <div class="keys">
          <button type="button" data-action="clear">C</button>
          <button type="button" data-action="percent" aria-label="percent">%</button>
          <button type="button" data-action="operator" data-value="/" aria-label="divide">÷</button>
          <button type="button" data-action="operator" data-value="*" aria-label="multiply">×</button>

          <button type="button" data-action="digit" data-value="7">7</button>
          <button type="button" data-action="digit" data-value="8">8</button>
          <button type="button" data-action="digit" data-value="9">9</button>
          <button type="button" data-action="operator" data-value="-" aria-label="subtract">−</button>

          <button type="button" data-action="digit" data-value="4">4</button>
          <button type="button" data-action="digit" data-value="5">5</button>
          <button type="button" data-action="digit" data-value="6">6</button>
          <button type="button" data-action="operator" data-value="+" aria-label="add">+</button>

          <button type="button" data-action="digit" data-value="1">1</button>
          <button type="button" data-action="digit" data-value="2">2</button>
          <button type="button" data-action="digit" data-value="3">3</button>
          <button type="button" data-action="equals">=</button>

          <button type="button" data-action="digit" data-value="0">0</button>
          <button type="button" data-action="decimal">.</button>
          <button type="button" data-action="delete" aria-label="delete">⌫</button>
        </div>

        <!-- The history screen. "hidden" keeps it out of sight until the clock button is pressed. -->
        <section id="history" class="panel" aria-labelledby="history-title" hidden>
          <header class="panel-header">
            <button type="button" id="history-close" class="icon-button" aria-label="Back to calculator">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="M12 19l-7-7 7-7" />
              </svg>
            </button>
            <h2 id="history-title">History</h2>
            <button type="button" id="history-clear" class="icon-button" aria-label="Clear history">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M6 6l1 14h10l1-14" />
                <path d="M10 10v6" />
                <path d="M14 10v6" />
              </svg>
            </button>
          </header>
          <div id="history-list" class="history-list"></div>
        </section>

        <!-- The converter: a grid of converters, and one screen per converter (only Currency so far). -->
        <section id="converter" class="panel" aria-labelledby="converter-title" hidden>
          <header class="panel-header">
            <button type="button" id="converter-close" class="icon-button" aria-label="Back">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="M12 19l-7-7 7-7" />
              </svg>
            </button>
            <h2 id="converter-title">Converter</h2>
            <span></span>
          </header>

          <div id="converter-home" class="converter-grid">
            <button type="button" class="converter-tile" data-converter="currency">
              <span class="tile-icon" aria-hidden="true">💱</span>Currency
            </button>
            <button type="button" class="converter-tile" data-converter="length">
              <span class="tile-icon" aria-hidden="true">📏</span>Length
            </button>
            <button type="button" class="converter-tile" data-converter="mass">
              <span class="tile-icon" aria-hidden="true">⚖️</span>Mass
            </button>
            <button type="button" class="converter-tile" data-converter="area">
              <span class="tile-icon" aria-hidden="true">⬛</span>Area
            </button>
            <button type="button" class="converter-tile" data-converter="time">
              <span class="tile-icon" aria-hidden="true">⏱️</span>Time
            </button>
            <button type="button" class="converter-tile" data-converter="finance" disabled>
              <span class="tile-icon" aria-hidden="true">💰</span>Finance<small>Soon</small>
            </button>
            <button type="button" class="converter-tile" data-converter="data" disabled>
              <span class="tile-icon" aria-hidden="true">💾</span>Data<small>Soon</small>
            </button>
            <button type="button" class="converter-tile" data-converter="date" disabled>
              <span class="tile-icon" aria-hidden="true">📅</span>Date<small>Soon</small>
            </button>
            <button type="button" class="converter-tile" data-converter="discount" disabled>
              <span class="tile-icon" aria-hidden="true">🏷️</span>Discount<small>Soon</small>
            </button>
            <button type="button" class="converter-tile" data-converter="volume" disabled>
              <span class="tile-icon" aria-hidden="true">🧊</span>Volume<small>Soon</small>
            </button>
            <button type="button" class="converter-tile" data-converter="numeral" disabled>
              <span class="tile-icon" aria-hidden="true">🔢</span>Numeral system<small>Soon</small>
            </button>
            <button type="button" class="converter-tile" data-converter="speed" disabled>
              <span class="tile-icon" aria-hidden="true">🚀</span>Speed<small>Soon</small>
            </button>
            <button type="button" class="converter-tile" data-converter="temperature" disabled>
              <span class="tile-icon" aria-hidden="true">🌡️</span>Temperature<small>Soon</small>
            </button>
            <button type="button" class="converter-tile" data-converter="bmi" disabled>
              <span class="tile-icon" aria-hidden="true">🩺</span>BMI<small>Soon</small>
            </button>
          </div>

          <div id="currency-view" class="convert" hidden>
            <!-- label + input pairs: clicking the label focuses the input, and screen readers read it out. -->
            <div class="convert-row">
              <label for="currency-from">From</label>
              <select id="currency-from"></select>
              <input id="currency-amount" type="text" inputmode="decimal" autocomplete="off" value="1" aria-label="Amount" />
            </div>

            <button type="button" id="currency-swap" class="convert-swap" aria-label="Swap currencies">⇅</button>

            <div class="convert-row">
              <label for="currency-to">To</label>
              <select id="currency-to"></select>
              <output id="currency-result" class="convert-result" aria-live="polite">–</output>
            </div>

            <p id="currency-rate" class="convert-rate"></p>
            <p id="currency-status" class="convert-status"></p>
          </div>

          <!-- One screen shared by every "unit" converter (length now; mass, area... later).
               units.js fills in the lists for whichever converter was opened. -->
          <div id="unit-view" class="convert" hidden>
            <div class="convert-row">
              <label for="unit-from">From</label>
              <select id="unit-from"></select>
              <input id="unit-amount" type="text" inputmode="decimal" autocomplete="off" value="1" aria-label="Amount" />
            </div>

            <button type="button" id="unit-swap" class="convert-swap" aria-label="Swap units">⇅</button>

            <div class="convert-row">
              <label for="unit-to">To</label>
              <select id="unit-to"></select>
              <output id="unit-result" class="convert-result" aria-live="polite">–</output>
            </div>

            <p id="unit-rate" class="convert-rate"></p>
          </div>
        </section>

        <!-- The settings screen: pick a theme. Each card's data-theme-option is the theme's name in the code. -->
        <section id="settings" class="panel" aria-labelledby="settings-title" hidden>
          <header class="panel-header">
            <button type="button" id="settings-close" class="icon-button" aria-label="Back to calculator">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="M12 19l-7-7 7-7" />
              </svg>
            </button>
            <h2 id="settings-title">Settings</h2>
            <span></span>
          </header>
          <p class="settings-label">Theme</p>
          <div id="theme-list" class="theme-list">
            <button type="button" class="theme-card" data-theme-option="classic" aria-pressed="true">
              <span class="swatch swatch-classic"></span>Classic
            </button>
            <button type="button" class="theme-card" data-theme-option="glass" aria-pressed="false">
              <span class="swatch swatch-glass"></span>Aurora glass
            </button>
            <button type="button" class="theme-card" data-theme-option="bold" aria-pressed="false">
              <span class="swatch swatch-bold"></span>Bold &amp; playful
            </button>
            <button type="button" class="theme-card" data-theme-option="neon" aria-pressed="false">
              <span class="swatch swatch-neon"></span>Midnight neon
            </button>
            <button type="button" class="theme-card" data-theme-option="daylight" aria-pressed="false">
              <span class="swatch swatch-daylight"></span>Daylight
            </button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
